<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lupa Password — OBBY AI</title>
<style>
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    font-family: 'Inter', system-ui, sans-serif;
    background: #060B18;
    color: #eee;
    display: flex; align-items: center; justify-content: center;
    min-height: 100vh; margin: 0; padding: 20px;
    position: relative; overflow-x: hidden;
  }

  .liquid-bg { position: fixed; inset: 0; overflow: hidden; z-index: 0; pointer-events: none; }
  .blob { position: absolute; border-radius: 50%; filter: blur(90px); }
  .blob-1 {
    width: 460px; height: 460px; top: -140px; left: -120px;
    background: radial-gradient(circle at 35% 35%, #2F6BFF, transparent 70%);
    opacity: 0.55; animation: floatA 16s ease-in-out infinite;
  }
  .blob-2 {
    width: 420px; height: 420px; bottom: -150px; right: -100px;
    background: radial-gradient(circle at 65% 65%, #22D3EE, transparent 70%);
    opacity: 0.5; animation: floatB 18s ease-in-out infinite;
  }
  .blob-3 {
    width: 320px; height: 320px; top: 35%; left: 55%;
    background: radial-gradient(circle, #7C9CFF, transparent 70%);
    opacity: 0.35; animation: floatC 20s ease-in-out infinite;
  }
  @keyframes floatA { 0%,100%{transform:translate(0,0);} 50%{transform:translate(50px,40px);} }
  @keyframes floatB { 0%,100%{transform:translate(0,0);} 50%{transform:translate(-40px,-50px);} }
  @keyframes floatC { 0%,100%{transform:translate(0,0) scale(1);} 50%{transform:translate(-30px,25px) scale(1.1);} }
  @media (prefers-reduced-motion: reduce) {
    .blob { animation: none !important; }
  }

  .card {
    position: relative; z-index: 1;
    background: rgba(255,255,255,0.06);
    border: 1px solid rgba(255,255,255,0.14);
    backdrop-filter: blur(28px) saturate(160%);
    -webkit-backdrop-filter: blur(28px) saturate(160%);
    box-shadow: 0 20px 60px -20px rgba(0,0,0,0.6), inset 0 1px 0 rgba(255,255,255,0.06);
    padding: 36px 32px; border-radius: 22px; width: 340px;
  }
  .brand-row { display: flex; align-items: center; gap: 9px; margin-bottom: 4px; }
  .brand-logo { width: 28px; height: 28px; border-radius: 9px; display: block; }
  .brand { font-weight: 700; letter-spacing: 2px; }
  h2 { margin: 0 0 8px; font-size: 20px; font-weight: 600; }
  p.desc { color: #999; font-size: 13px; margin: 0 0 18px; line-height: 1.4; }
  input {
    width: 100%; padding: 12px 14px; margin: 6px 0; border-radius: 10px;
    border: 1px solid rgba(255,255,255,0.14); background: rgba(0,0,0,0.28);
    color: #eee; font-size: 14px;
  }
  input:focus { outline: none; border-color: #3FA9F5; }
  input.otp-input {
    text-align: center; font-size: 22px; letter-spacing: 10px; font-weight: 700;
  }
  .password-wrap { position: relative; }
  .password-wrap input { padding-right: 42px; }
  .toggle-password-btn {
    position: absolute; right: 8px; top: 50%; transform: translateY(-50%);
    background: none; border: none; padding: 4px; margin: 0; width: auto;
    cursor: pointer; color: #888; display: flex; align-items: center;
  }
  .toggle-password-btn:hover { color: #ccc; }
  button {
    width: 100%; padding: 12px; margin-top: 14px; border: none; border-radius: 10px;
    background: linear-gradient(135deg, #2F6BFF, #22D3EE); color: white;
    font-weight: 600; font-size: 14px; cursor: pointer;
    box-shadow: 0 6px 20px -6px rgba(47,107,255,0.5);
  }
  button:disabled { opacity: 0.6; cursor: not-allowed; }
  button.secondary { background: rgba(255,255,255,0.08); margin-top: 8px; box-shadow: none; }
  #msg { margin-top: 12px; font-size: 13px; min-height: 18px; }
  a { color: #6FC7FF; text-decoration: none; }
  p.footer { margin-top: 16px; font-size: 13px; text-align: center; color: #999; }
  .step { display: none; }
  .step.active { display: block; }
</style>
</head>
<body>
  <div class="liquid-bg" aria-hidden="true">
    <span class="blob blob-1"></span>
    <span class="blob blob-2"></span>
    <span class="blob blob-3"></span>
  </div>

  <div class="card">
    <div class="brand-row">
      <img src="icon-192.png" alt="OBBY AI" class="brand-logo">
      <div class="brand">O B B Y</div>
    </div>

    <!-- STEP 1: masukkan email -->
    <form id="stepEmail" class="step active">
      <h2 data-i18n="forgotHeading">Lupa Password</h2>
      <p class="desc" data-i18n="forgotDesc">Masukkan email akun kamu, kami kirim kode OTP 6 digit ke email tersebut.</p>
      <input type="email" id="emailInput" data-i18n-placeholder="emailPlaceholder" placeholder="Email" required>
      <button type="submit" id="sendOtpBtn" data-i18n="sendOtpBtn">Kirim Kode OTP</button>
      <p id="msgEmail"></p>
      <p class="footer"><a href="login.html" data-i18n="backToLogin">← Kembali ke Login</a></p>
    </form>

    <!-- STEP 2: masukkan OTP + password baru -->
    <form id="stepReset" class="step">
      <h2 data-i18n="resetHeading">Masukkan Kode</h2>
      <p class="desc" id="resetDesc"></p>
      <input type="text" id="otpInput" class="otp-input" placeholder="000000" maxlength="6" inputmode="numeric" required>
      <div class="password-wrap">
        <input type="password" id="newPasswordInput" data-i18n-placeholder="newPasswordPlaceholder" placeholder="Password baru (min 8 karakter)" required>
        <button type="button" class="toggle-password-btn" data-target="newPasswordInput" aria-label="Lihat password">
          <svg class="eye-open" width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7Z" stroke="currentColor" stroke-width="2"/><circle cx="12" cy="12" r="3" stroke="currentColor" stroke-width="2"/></svg>
          <svg class="eye-closed" width="18" height="18" viewBox="0 0 24 24" fill="none" style="display:none;"><path d="M3 3l18 18M10.6 10.6a2 2 0 0 0 2.8 2.8M9.4 5.3A10.5 10.5 0 0 1 12 5c7 0 11 7 11 7a13.4 13.4 0 0 1-3.1 3.6M6.1 6.1A13.6 13.6 0 0 0 1 12s4 7 11 7a10.4 10.4 0 0 0 4-0.8" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
        </button>
      </div>
      <button type="submit" id="resetBtn" data-i18n="resetBtn">Reset Password</button>
      <button type="button" class="secondary" id="resendBtn" data-i18n="resendBtn">Kirim ulang kode</button>
      <p id="msgReset"></p>
    </form>
  </div>

<script src="auth-i18n.js"></script>
<script src="auth.js"></script>
<script>
  const stepEmail = document.getElementById('stepEmail');
  const stepReset = document.getElementById('stepReset');
  let targetEmail = '';

  function escapeHtmlSimple(str) {
    return str.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  }

  document.querySelectorAll('.toggle-password-btn').forEach((btn) => {
    btn.addEventListener('click', () => {
      const input = document.getElementById(btn.dataset.target);
      const isHidden = input.type === 'password';
      input.type = isHidden ? 'text' : 'password';
      btn.querySelector('.eye-open').style.display = isHidden ? 'none' : 'block';
      btn.querySelector('.eye-closed').style.display = isHidden ? 'block' : 'none';
    });
  });

  function goToStep(step) {
    stepEmail.classList.remove('active');
    stepReset.classList.remove('active');
    step.classList.add('active');
  }

  function updateResetDesc() {
    document.getElementById('resetDesc').innerHTML = t('resetDescTemplate', {
      email: `<strong>${escapeHtmlSimple(targetEmail)}</strong>`,
    });
  }

  stepEmail.addEventListener('submit', async (e) => {
    e.preventDefault();
    const msg = document.getElementById('msgEmail');
    const btn = document.getElementById('sendOtpBtn');
    targetEmail = document.getElementById('emailInput').value;

    btn.disabled = true;
    msg.style.color = '#aaa';
    msg.textContent = t('msgSendingCode');

    try {
      await ObbyAuth.requestPasswordResetOtp(targetEmail);
      updateResetDesc();
      goToStep(stepReset);
    } catch (err) {
      msg.style.color = '#FF6B6B';
      msg.textContent = err.message;
    } finally {
      btn.disabled = false;
    }
  });

  stepReset.addEventListener('submit', async (e) => {
    e.preventDefault();
    const msg = document.getElementById('msgReset');
    const btn = document.getElementById('resetBtn');
    const otp = document.getElementById('otpInput').value;
    const newPassword = document.getElementById('newPasswordInput').value;

    btn.disabled = true;
    msg.style.color = '#aaa';
    msg.textContent = t('msgProcessing');

    try {
      await ObbyAuth.resetPassword({ email: targetEmail, otp, newPassword });
      msg.style.color = '#6BFFB0';
      msg.textContent = t('msgSuccessRedirectLogin');
      setTimeout(() => { window.location.href = 'login.html'; }, 1200);
    } catch (err) {
      msg.style.color = '#FF6B6B';
      msg.textContent = err.message;
      btn.disabled = false;
    }
  });

  document.getElementById('resendBtn').addEventListener('click', async () => {
    const msg = document.getElementById('msgReset');
    msg.style.color = '#aaa';
    msg.textContent = t('msgResending');
    try {
      await ObbyAuth.requestPasswordResetOtp(targetEmail);
      msg.style.color = '#6BFFB0';
      msg.textContent = t('msgResentSuccess');
    } catch (err) {
      msg.style.color = '#FF6B6B';
      msg.textContent = err.message;
    }
  });
</script>
</body>
</html>
