<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lupa Password — OBBY AI</title>
<style>
  * { box-sizing: border-box; }
  body {
    font-family: 'Inter', system-ui, sans-serif;
    background: #060B18;
    color: #eee;
    display: flex; align-items: center; justify-content: center;
    min-height: 100vh; margin: 0; padding: 20px;
  }
  .card {
    background: rgba(255,255,255,0.04);
    border: 1px solid rgba(255,255,255,0.08);
    backdrop-filter: blur(20px);
    padding: 36px 32px; border-radius: 20px; width: 340px;
  }
  .brand { font-weight: 700; letter-spacing: 2px; margin-bottom: 4px; }
  h2 { margin: 0 0 8px; font-size: 20px; font-weight: 600; }
  p.desc { color: #999; font-size: 13px; margin: 0 0 18px; line-height: 1.4; }
  input {
    width: 100%; padding: 12px 14px; margin: 6px 0; border-radius: 10px;
    border: 1px solid rgba(255,255,255,0.12); background: rgba(0,0,0,0.3);
    color: #eee; font-size: 14px;
  }
  input:focus { outline: none; border-color: #7C9CFF; }
  input.otp-input {
    text-align: center; font-size: 22px; letter-spacing: 10px; font-weight: 700;
  }
  button {
    width: 100%; padding: 12px; margin-top: 14px; border: none; border-radius: 10px;
    background: linear-gradient(135deg, #7C9CFF, #B37CFF); color: white;
    font-weight: 600; font-size: 14px; cursor: pointer;
  }
  button:disabled { opacity: 0.6; cursor: not-allowed; }
  button.secondary {
    background: rgba(255,255,255,0.08); margin-top: 8px;
  }
  #msg { margin-top: 12px; font-size: 13px; min-height: 18px; }
  a { color: #9CB4FF; text-decoration: none; }
  p.footer { margin-top: 16px; font-size: 13px; text-align: center; color: #999; }
  .step { display: none; }
  .step.active { display: block; }
</style>
</head>
<body>
  <div class="card">
    <div class="brand">O B B Y</div>

    <!-- STEP 1: masukkan email -->
    <form id="stepEmail" class="step active">
      <h2>Lupa Password</h2>
      <p class="desc">Masukkan email akun kamu, kami kirim kode OTP 6 digit ke email tersebut.</p>
      <input type="email" id="emailInput" placeholder="Email" required>
      <button type="submit" id="sendOtpBtn">Kirim Kode OTP</button>
      <p id="msgEmail"></p>
      <p class="footer"><a href="login.html">← Kembali ke Login</a></p>
    </form>

    <!-- STEP 2: masukkan OTP + password baru -->
    <form id="stepReset" class="step">
      <h2>Masukkan Kode</h2>
      <p class="desc">Kode OTP sudah dikirim ke <strong id="emailShown"></strong>. Cek juga folder Spam kalau belum muncul.</p>
      <input type="text" id="otpInput" class="otp-input" placeholder="000000" maxlength="6" inputmode="numeric" required>
      <input type="password" id="newPasswordInput" placeholder="Password baru (min 8 karakter)" required>
      <button type="submit" id="resetBtn">Reset Password</button>
      <button type="button" class="secondary" id="resendBtn">Kirim ulang kode</button>
      <p id="msgReset"></p>
    </form>
  </div>

<script src="auth.js"></script>
<script>
  const stepEmail = document.getElementById('stepEmail');
  const stepReset = document.getElementById('stepReset');
  let targetEmail = '';

  function goToStep(step) {
    stepEmail.classList.remove('active');
    stepReset.classList.remove('active');
    step.classList.add('active');
  }

  stepEmail.addEventListener('submit', async (e) => {
    e.preventDefault();
    const msg = document.getElementById('msgEmail');
    const btn = document.getElementById('sendOtpBtn');
    targetEmail = document.getElementById('emailInput').value;

    btn.disabled = true;
    msg.style.color = '#aaa';
    msg.textContent = 'Mengirim kode...';

    try {
      await ObbyAuth.requestPasswordResetOtp(targetEmail);
      document.getElementById('emailShown').textContent = targetEmail;
      goToStep(stepReset);
    } catch (err) {
      msg.style.color = '#FF6B6B';
      msg.textContent = err.message;
    } finally {
      btn.disabled = false;
    }
  });

  stepReset.addEventListener('submit', async (e) => {
    e.preventDefault();
    const msg = document.getElementById('msgReset');
    const btn = document.getElementById('resetBtn');
    const otp = document.getElementById('otpInput').value;
    const newPassword = document.getElementById('newPasswordInput').value;

    btn.disabled = true;
    msg.style.color = '#aaa';
    msg.textContent = 'Memproses...';

    try {
      await ObbyAuth.resetPassword({ email: targetEmail, otp, newPassword });
      msg.style.color = '#6BFFB0';
      msg.textContent = 'Berhasil! Mengalihkan ke login...';
      setTimeout(() => { window.location.href = 'login.html'; }, 1200);
    } catch (err) {
      msg.style.color = '#FF6B6B';
      msg.textContent = err.message;
      btn.disabled = false;
    }
  });

  document.getElementById('resendBtn').addEventListener('click', async () => {
    const msg = document.getElementById('msgReset');
    msg.style.color = '#aaa';
    msg.textContent = 'Mengirim ulang...';
    try {
      await ObbyAuth.requestPasswordResetOtp(targetEmail);
      msg.style.color = '#6BFFB0';
      msg.textContent = 'Kode baru sudah dikirim.';
    } catch (err) {
      msg.style.color = '#FF6B6B';
      msg.textContent = err.message;
    }
  });
</script>
</body>
</html>
