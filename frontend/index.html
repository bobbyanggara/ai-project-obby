<!DOCTYPE html>
<html lang="id" data-theme="dark">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>OBBY AI</title>
<link rel="manifest" href="./manifest.json">
<meta name="theme-color" content="#060B18">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- Liquid gradient background -->
  <div class="liquid-bg" aria-hidden="true">
    <span class="blob blob-1"></span>
    <span class="blob blob-2"></span>
    <span class="blob blob-3"></span>
  </div>

  <div class="app">
    <div id="backdrop" class="backdrop"></div>

    <!-- SIDEBAR -->
    <aside id="sidebar" class="sidebar glass">
      <div class="sidebar-top">
        <div class="brand">
          <span class="brand-mark"></span>
          <span class="brand-name">O B B Y</span>
        </div>
        <button id="closeSidebarBtn" class="icon-btn sidebar-close tooltip-bottom tooltip-end" data-i18n-tooltip="tooltipSidebarClose" data-tooltip="Tutup sidebar" aria-label="Close">✕</button>
      </div>

      <button id="newChatBtn" class="new-chat-btn glass-inset" data-i18n-tooltip="tooltipNewChat" data-tooltip="Mulai obrolan baru">
        <span class="plus">+</span> <span data-i18n="newChat">Obrolan baru</span>
      </button>

      <div class="sidebar-label" data-i18n="history">Riwayat</div>
      <div id="historyList" class="history-list"></div>

      <div class="sidebar-footer">
        <div class="settings-row">
          <button id="themeToggle" class="pill-toggle" data-i18n-tooltip="tooltipTheme" data-tooltip="Ganti tema terang/gelap" aria-label="Toggle theme">
            <span class="pill-icon sun">☾</span>
            <span class="pill-icon moon">☀</span>
            <span class="pill-knob"></span>
          </button>
          <button id="langToggle" class="lang-btn" data-i18n-tooltip="tooltipLang" data-tooltip="Ganti bahasa" aria-label="Ganti bahasa">ID/EN</button>
        </div>
        <button id="clearPartialBtn" class="text-btn" aria-label="Hapus sebagian riwayat" data-tooltip="Hapus sebagian riwayat obrolan">Hapus sebagian</button>
        <button id="clearAllBtn" class="text-btn danger" data-i18n="clearAll" data-i18n-tooltip="tooltipClearAll" data-tooltip="Hapus semua riwayat obrolan">Hapus semua riwayat</button>

        <button id="loginNavBtn" class="text-btn" data-tooltip="Login untuk simpan riwayat ke akun" aria-label="Login">Login / Daftar</button>
        <button id="logoutBtn" class="text-btn" style="display:none;" data-tooltip="Keluar dari akun" aria-label="Logout">Logout</button>
      </div>
    </aside>

    <!-- MAIN -->
    <main class="chat-area">
      <header class="chat-header glass">
        <button id="menuBtn" class="icon-btn menu-btn tooltip-bottom tooltip-start" data-i18n-tooltip="tooltipMenu" data-tooltip="Buka menu" aria-label="Menu">
          <span></span><span></span><span></span>
        </button>
        <button id="sidebarOpenBtn" class="icon-btn sidebar-open-btn sidebar-open-btn tooltip-bottom tooltip-start" data-i18n-tooltip="tooltipSidebarOpen" data-tooltip="Buka sidebar" aria-label="Open sidebar">
          ☰
        </button>

        <div id="chatTitleWrap" class="chat-title-wrap">
          <h1 id="chatTitle" data-i18n="newChat">Obrolan baru</h1>
          <button id="titleMenuBtn" class="title-caret-btn tooltip-bottom" data-i18n-tooltip="tooltipChatOptions" data-tooltip="Opsi obrolan" aria-haspopup="true" aria-expanded="false" aria-label="Opsi obrolan">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none"><path d="M6 9l6 6 6-6" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </button>

          <div id="titleDropdown" class="title-dropdown" role="menu">
            <button type="button" id="starChatBtn" class="title-dropdown-item" role="menuitem">
              <span class="tdi-icon">☆</span><span id="starChatLabel">Beri bintang</span>
            </button>
            <button type="button" id="renameChatBtn" class="title-dropdown-item" role="menuitem">
              <span class="tdi-icon">✎</span><span id="renameChatLabel">Ganti judul</span>
            </button>
            <button type="button" id="deleteChatBtn" class="title-dropdown-item danger" role="menuitem">
              <span class="tdi-icon">🗑</span><span id="deleteChatLabel">Hapus obrolan</span>
            </button>
          </div>
        </div>
        <button id="regenBtn" class="icon-btn tooltip-bottom tooltip-end" data-i18n-tooltip="tooltipRegen" data-tooltip="Buat ulang jawaban" aria-label="Regenerate">↻</button>
      </header>

      <div id="messages" class="messages">
        <div id="emptyState" class="empty-state">
          <div class="empty-mark"></div>
          <h2 data-i18n="emptyTitle">Halo, ada yang bisa dibantu?</h2>
          <p data-i18n="emptySubtitle">Tanyakan apa saja — dari ide, kode, sampai obrolan santai.</p>
          <div class="suggestions" id="suggestions"></div>
        </div>
      </div>

      <button id="scrollDownBtn" type="button" class="scroll-down-btn" data-i18n-tooltip="tooltipScrollDown" data-tooltip="Ke pesan terbaru" aria-label="Ke pesan terbaru">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none">
          <defs>
            <linearGradient id="scrollArrowGradient" x1="0" y1="0" x2="24" y2="24" gradientUnits="userSpaceOnUse">
              <stop offset="0%" stop-color="var(--accent-1)" />
              <stop offset="100%" stop-color="var(--accent-2)" />
            </linearGradient>
          </defs>
          <path d="M12 4v15M5 12l7 7 7-7" stroke="url(#scrollArrowGradient)" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </button>

      <div class="composer-wrap">
        <form id="chatForm" class="chat-input-form glass">
          <textarea
            id="userInput"
            data-i18n-placeholder="placeholder"
            placeholder="Tanya Obby"
            rows="1"
            required
          ></textarea>
          <button type="submit" id="sendBtn" class="send-btn" data-i18n-tooltip="tooltipSend" data-tooltip="Kirim pesan" aria-label="Send">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="M4 12L20 4L13 20L11 13L4 12Z" stroke="currentColor" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/></svg>
          </button>
        </form>
        <div class="composer-hint" data-i18n="hint">Obby adalah AI dan bisa melakukan kesalahan.</div>
      </div>
    </main>
  </div>

  <div id="toast" class="toast"></div>

  <script src="auth.js"></script>
  <script src="app.js"></script>
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('./service-worker.js');
    }
  </script>
</body>
</html>
