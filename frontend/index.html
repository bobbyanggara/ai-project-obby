<!DOCTYPE html>
<html lang="id" data-theme="dark">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>OBBY AI</title>
<link rel="manifest" href="./manifest.json">
<meta name="theme-color" content="#060B18">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- Liquid gradient background -->
  <div class="liquid-bg" aria-hidden="true">
    <span class="blob blob-1"></span>
    <span class="blob blob-2"></span>
    <span class="blob blob-3"></span>
  </div>

  <div class="app">
    <div id="backdrop" class="backdrop"></div>

    <!-- SIDEBAR -->
    <aside id="sidebar" class="sidebar glass">
      <div class="sidebar-top">
        <div class="brand">
          <span class="brand-mark"></span>
          <span class="brand-name">O B B Y</span>
        </div>
        <button id="closeSidebarBtn" class="icon-btn sidebar-close" aria-label="Close">✕</button>
      </div>

      <button id="newChatBtn" class="new-chat-btn glass-inset">
        <span class="plus">+</span> <span data-i18n="newChat">Obrolan baru</span>
      </button>

      <div class="sidebar-label" data-i18n="history">Riwayat</div>
      <div id="historyList" class="history-list"></div>

      <div class="sidebar-footer">
        <div class="settings-row">
          <button id="themeToggle" class="pill-toggle" aria-label="Toggle theme">
            <span class="pill-icon sun">☾</span>
            <span class="pill-icon moon">☀</span>
            <span class="pill-knob"></span>
          </button>
          <button id="langToggle" class="lang-btn" aria-label="Ganti bahasa" title="Ganti bahasa">ID/EN</button>
        </div>
        <button id="clearPartialBtn" class="text-btn" aria-label="Hapus sebagian riwayat" title="Hapus sebagian riwayat (sisa 3 obrolan terbaru)">Hapus sebagian</button>
        <button id="clearAllBtn" class="text-btn danger" data-i18n="clearAll">Hapus semua riwayat</button>

        <button id="logoutBtn" class="text-btn" style="display:none;" aria-label="Logout">Logout</button>
      </div>
    </aside>

    <!-- MAIN -->
    <main class="chat-area">
      <header class="chat-header glass">
        <button id="menuBtn" class="icon-btn menu-btn" aria-label="Menu">
          <span></span><span></span><span></span>
        </button>
        <button id="sidebarOpenBtn" class="icon-btn sidebar-open-btn sidebar-open-btn" aria-label="Open sidebar">
          ☰
        </button>

        <h1 id="chatTitle" data-i18n="newChat">Obrolan baru</h1>
        <button id="regenBtn" class="icon-btn" title="Regenerate" aria-label="Regenerate">↻</button>
      </header>

      <div id="messages" class="messages">
        <div id="emptyState" class="empty-state">
          <div class="empty-mark"></div>
          <h2 data-i18n="emptyTitle">Halo, ada yang bisa dibantu?</h2>
          <p data-i18n="emptySubtitle">Tanyakan apa saja — dari ide, kode, sampai obrolan santai.</p>
          <div class="suggestions" id="suggestions"></div>
        </div>
      </div>

      <div class="composer-wrap">
        <form id="chatForm" class="chat-input-form glass">
          <textarea
            id="userInput"
            data-i18n-placeholder="placeholder"
            placeholder="Tanya Obby"
            rows="1"
            required
          ></textarea>
          <button type="submit" id="sendBtn" class="send-btn" aria-label="Send">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="M4 12L20 4L13 20L11 13L4 12Z" stroke="currentColor" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/></svg>
          </button>
        </form>
        <div class="composer-hint" data-i18n="hint">Obby adalah AI dan bisa melakukan kesalahan.</div>
      </div>
    </main>
  </div>

  <div id="toast" class="toast"></div>

  <script src="app.js"></script>
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('./service-worker.js');
    }
  </script>
</body>
</html>
