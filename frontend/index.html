<!DOCTYPE html>
<html lang="id" data-theme="dark">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>OBBY AI</title>
<link rel="manifest" href="./manifest.json">
<meta name="theme-color" content="#060B18">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css" />
<style>
  .auth-cta-btn {
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    width: 100%;
    padding: 10px 16px;
    margin-top: 8px;
    border: none;
    border-radius: 12px;
    background: linear-gradient(135deg, var(--accent-1, #7C9CFF), var(--accent-2, #B37CFF));
    color: #fff;
    font-family: inherit;
    font-size: 13.5px;
    font-weight: 600;
    letter-spacing: 0.2px;
    cursor: pointer;
    overflow: hidden;
    box-shadow: 0 4px 16px -4px rgba(124, 156, 255, 0.5);
    transition: transform 0.18s ease, box-shadow 0.18s ease;
  }
  .auth-cta-btn:hover {
    transform: translateY(-1px) scale(1.015);
    box-shadow: 0 6px 20px -4px rgba(124, 156, 255, 0.65);
  }
  .auth-cta-btn:active {
    transform: translateY(0) scale(0.99);
  }
  .auth-cta-icon {
    flex-shrink: 0;
    position: relative;
    z-index: 1;
  }
  .auth-cta-label {
    position: relative;
    z-index: 1;
  }
  .auth-cta-shine {
    position: absolute;
    top: 0;
    left: -60%;
    width: 40%;
    height: 100%;
    background: linear-gradient(120deg, transparent, rgba(255,255,255,0.35), transparent);
    transform: skewX(-20deg);
    animation: authShine 3.2s ease-in-out infinite;
  }
  @keyframes authShine {
    0%   { left: -60%; }
    45%  { left: 130%; }
    100% { left: 130%; }
  }
  @media (prefers-reduced-motion: reduce) {
    .auth-cta-shine { animation: none; display: none; }
  }

  /* ---- Varian danger untuk tombol Logout ---- */
  .auth-cta-btn--danger {
    background: linear-gradient(135deg, #FF6B6B, #FF9472);
    box-shadow: 0 4px 16px -4px rgba(255, 107, 107, 0.45);
  }
  .auth-cta-btn--danger:hover {
    box-shadow: 0 6px 20px -4px rgba(255, 107, 107, 0.6);
  }

  /* ---- Modal konfirmasi logout ---- */
  .confirm-modal-backdrop {
    position: fixed;
    inset: 0;
    background: rgba(6, 11, 24, 0.6);
    backdrop-filter: blur(6px);
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 999;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.2s ease;
  }
  .confirm-modal-backdrop.open {
    opacity: 1;
    pointer-events: auto;
  }
  .confirm-modal-card {
    width: 320px;
    max-width: 90vw;
    background: rgba(20, 24, 38, 0.9);
    border: 1px solid rgba(255,255,255,0.1);
    border-radius: 18px;
    padding: 24px;
    text-align: center;
    transform: translateY(10px) scale(0.97);
    transition: transform 0.2s ease;
    box-shadow: 0 20px 60px -10px rgba(0,0,0,0.6);
  }
  .confirm-modal-backdrop.open .confirm-modal-card {
    transform: translateY(0) scale(1);
  }
  .confirm-modal-icon {
    width: 48px;
    height: 48px;
    margin: 0 auto 14px;
    border-radius: 50%;
    background: linear-gradient(135deg, #FF6B6B, #FF9472);
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .confirm-modal-title {
    font-size: 16px;
    font-weight: 700;
    color: #fff;
    margin: 0 0 6px;
  }
  .confirm-modal-text {
    font-size: 13.5px;
    color: #aaa;
    margin: 0 0 20px;
    line-height: 1.4;
  }
  .confirm-modal-actions {
    display: flex;
    gap: 10px;
  }
  .confirm-modal-actions button {
    flex: 1;
    padding: 10px 0;
    border: none;
    border-radius: 10px;
    font-size: 13.5px;
    font-weight: 600;
    cursor: pointer;
    font-family: inherit;
    transition: transform 0.15s ease, opacity 0.15s ease;
  }
  .confirm-modal-actions button:active { transform: scale(0.96); }
  #logoutCancelBtn {
    background: rgba(255,255,255,0.08);
    color: #eee;
  }
  #logoutCancelBtn:hover { background: rgba(255,255,255,0.14); }
  #logoutConfirmBtn {
    background: linear-gradient(135deg, #FF6B6B, #FF9472);
    color: #fff;
  }
  #logoutConfirmBtn:hover { opacity: 0.9; }

  /* ---- Kartu info user (nama, email, avatar) ---- */
  .user-info-box {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 10px 12px;
    margin-top: 8px;
    border-radius: 12px;
    background: rgba(255,255,255,0.04);
    border: 1px solid rgba(255,255,255,0.08);
  }
  .user-info-avatar {
    flex-shrink: 0;
    width: 34px;
    height: 34px;
    border-radius: 50%;
    background: linear-gradient(135deg, var(--accent-1, #7C9CFF), var(--accent-2, #B37CFF));
    color: #fff;
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: 700;
    font-size: 14px;
    text-transform: uppercase;
  }
  .user-info-text {
    min-width: 0;
    flex: 1;
  }
  .user-info-name {
    font-size: 13px;
    font-weight: 600;
    color: #eee;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .user-info-email {
    font-size: 11.5px;
    color: #888;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
</style>
</head>
<body>

  <!-- Liquid gradient background -->
  <div class="liquid-bg" aria-hidden="true">
    <span class="blob blob-1"></span>
    <span class="blob blob-2"></span>
    <span class="blob blob-3"></span>
  </div>

  <div class="app">
    <div id="backdrop" class="backdrop"></div>

    <!-- SIDEBAR -->
    <aside id="sidebar" class="sidebar glass">
      <div class="sidebar-top">
        <div class="brand">
          <span class="brand-mark"></span>
          <span class="brand-name">O B B Y</span>
        </div>
        <button id="closeSidebarBtn" class="icon-btn sidebar-close tooltip-bottom tooltip-end" data-i18n-tooltip="tooltipSidebarClose" data-tooltip="Tutup sidebar" aria-label="Close">✕</button>
      </div>

      <button id="newChatBtn" class="new-chat-btn glass-inset" data-i18n-tooltip="tooltipNewChat" data-tooltip="Mulai obrolan baru">
        <span class="plus">+</span> <span data-i18n="newChat">Obrolan baru</span>
      </button>

      <div class="sidebar-label" data-i18n="history">Riwayat</div>
      <div id="historyList" class="history-list"></div>

      <div class="sidebar-footer">
        <div class="settings-row">
          <button id="themeToggle" class="pill-toggle" data-i18n-tooltip="tooltipTheme" data-tooltip="Ganti tema terang/gelap" aria-label="Toggle theme">
            <span class="pill-icon sun">☾</span>
            <span class="pill-icon moon">☀</span>
            <span class="pill-knob"></span>
          </button>
          <button id="langToggle" class="lang-btn" data-i18n-tooltip="tooltipLang" data-tooltip="Ganti bahasa" aria-label="Ganti bahasa">ID/EN</button>
        </div>
        <button id="clearPartialBtn" class="text-btn" aria-label="Hapus sebagian riwayat" data-tooltip="Hapus sebagian riwayat obrolan">Hapus sebagian</button>
        <button id="clearAllBtn" class="text-btn danger" data-i18n="clearAll" data-i18n-tooltip="tooltipClearAll" data-tooltip="Hapus semua riwayat obrolan">Hapus semua riwayat</button>

        <div id="userInfoBox" class="user-info-box" style="display:none;">
          <div class="user-info-avatar" id="userInfoAvatar"></div>
          <div class="user-info-text">
            <div class="user-info-name" id="userInfoName"></div>
            <div class="user-info-email" id="userInfoEmail"></div>
          </div>
        </div>

        <button id="loginNavBtn" class="auth-cta-btn" data-tooltip="Login untuk simpan riwayat ke akun" aria-label="Login">
          <svg class="auth-cta-icon" width="16" height="16" viewBox="0 0 24 24" fill="none">
            <path d="M12 12c2.7 0 4.9-2.2 4.9-4.9S14.7 2.2 12 2.2 7.1 4.4 7.1 7.1 9.3 12 12 12Zm0 2.2c-3.3 0-9.8 1.6-9.8 4.9v2.7h19.6v-2.7c0-3.3-6.5-4.9-9.8-4.9Z" fill="currentColor"/>
          </svg>
          <span class="auth-cta-label">Login / Daftar</span>
          <span class="auth-cta-shine"></span>
        </button>
        <button id="logoutBtn" class="auth-cta-btn auth-cta-btn--danger" style="display:none;" data-tooltip="Keluar dari akun" aria-label="Logout">
          <svg class="auth-cta-icon" width="16" height="16" viewBox="0 0 24 24" fill="none">
            <path d="M15 3H6a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h9" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
            <path d="M10 17l5-5-5-5M20 12H10" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
          <span class="auth-cta-label">Logout</span>
        </button>
      </div>
    </aside>

    <!-- MAIN -->
    <main class="chat-area">
      <header class="chat-header glass">
        <button id="menuBtn" class="icon-btn menu-btn tooltip-bottom tooltip-start" data-i18n-tooltip="tooltipMenu" data-tooltip="Buka menu" aria-label="Menu">
          <span></span><span></span><span></span>
        </button>
        <button id="sidebarOpenBtn" class="icon-btn sidebar-open-btn sidebar-open-btn tooltip-bottom tooltip-start" data-i18n-tooltip="tooltipSidebarOpen" data-tooltip="Buka sidebar" aria-label="Open sidebar">
          ☰
        </button>

        <div id="chatTitleWrap" class="chat-title-wrap">
          <h1 id="chatTitle" data-i18n="newChat">Obrolan baru</h1>
          <button id="titleMenuBtn" class="title-caret-btn tooltip-bottom" data-i18n-tooltip="tooltipChatOptions" data-tooltip="Opsi obrolan" aria-haspopup="true" aria-expanded="false" aria-label="Opsi obrolan">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none"><path d="M6 9l6 6 6-6" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </button>

          <div id="titleDropdown" class="title-dropdown" role="menu">
            <button type="button" id="starChatBtn" class="title-dropdown-item" role="menuitem">
              <span class="tdi-icon">☆</span><span id="starChatLabel">Beri bintang</span>
            </button>
            <button type="button" id="renameChatBtn" class="title-dropdown-item" role="menuitem">
              <span class="tdi-icon">✎</span><span id="renameChatLabel">Ganti judul</span>
            </button>
            <button type="button" id="deleteChatBtn" class="title-dropdown-item danger" role="menuitem">
              <span class="tdi-icon">🗑</span><span id="deleteChatLabel">Hapus obrolan</span>
            </button>
          </div>
        </div>
        <button id="regenBtn" class="icon-btn tooltip-bottom tooltip-end" data-i18n-tooltip="tooltipRegen" data-tooltip="Buat ulang jawaban" aria-label="Regenerate">↻</button>
      </header>

      <div id="messages" class="messages">
        <div id="emptyState" class="empty-state">
          <div class="empty-mark"></div>
          <h2 data-i18n="emptyTitle">Halo, ada yang bisa dibantu?</h2>
          <p data-i18n="emptySubtitle">Tanyakan apa saja — dari ide, kode, sampai obrolan santai.</p>
          <div class="suggestions" id="suggestions"></div>
        </div>
      </div>

      <button id="scrollDownBtn" type="button" class="scroll-down-btn" data-i18n-tooltip="tooltipScrollDown" data-tooltip="Ke pesan terbaru" aria-label="Ke pesan terbaru">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none">
          <defs>
            <linearGradient id="scrollArrowGradient" x1="0" y1="0" x2="24" y2="24" gradientUnits="userSpaceOnUse">
              <stop offset="0%" stop-color="var(--accent-1)" />
              <stop offset="100%" stop-color="var(--accent-2)" />
            </linearGradient>
          </defs>
          <path d="M12 4v15M5 12l7 7 7-7" stroke="url(#scrollArrowGradient)" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </button>

      <div class="composer-wrap">
        <form id="chatForm" class="chat-input-form glass">
          <textarea
            id="userInput"
            data-i18n-placeholder="placeholder"
            placeholder="Tanya Obby"
            rows="1"
            required
          ></textarea>
          <button type="submit" id="sendBtn" class="send-btn" data-i18n-tooltip="tooltipSend" data-tooltip="Kirim pesan" aria-label="Send">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="M4 12L20 4L13 20L11 13L4 12Z" stroke="currentColor" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/></svg>
          </button>
        </form>
        <div class="composer-hint" data-i18n="hint">Obby adalah AI dan bisa melakukan kesalahan.</div>
      </div>
    </main>
  </div>

  <div id="toast" class="toast"></div>

  <!-- Modal konfirmasi logout -->
  <div id="logoutConfirmBackdrop" class="confirm-modal-backdrop">
    <div class="confirm-modal-card">
      <div class="confirm-modal-icon">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none">
          <path d="M15 3H6a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h9" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
          <path d="M10 17l5-5-5-5M20 12H10" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </div>
      <p class="confirm-modal-title">Yakin mau logout?</p>
      <p class="confirm-modal-text">Riwayat chat yang sudah tersimpan tetap aman di akun kamu. Kamu bisa login lagi kapan saja.</p>
      <div class="confirm-modal-actions">
        <button id="logoutCancelBtn" type="button">Batal</button>
        <button id="logoutConfirmBtn" type="button">Ya, Logout</button>
      </div>
    </div>
  </div>

  <script src="auth.js"></script>
  <script src="app.js"></script>
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('./service-worker.js');
    }
  </script>
</body>
</html>
