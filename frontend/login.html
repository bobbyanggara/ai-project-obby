<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login — OBBY AI</title>
<style>
  * { box-sizing: border-box; }
  body {
    font-family: 'Inter', system-ui, sans-serif;
    background: #060B18;
    color: #eee;
    display: flex; align-items: center; justify-content: center;
    min-height: 100vh; margin: 0; padding: 20px;
  }
  .card {
    background: rgba(255,255,255,0.04);
    border: 1px solid rgba(255,255,255,0.08);
    backdrop-filter: blur(20px);
    padding: 36px 32px; border-radius: 20px; width: 340px;
  }
  .brand { font-weight: 700; letter-spacing: 2px; margin-bottom: 4px; }
  h2 { margin: 0 0 20px; font-size: 20px; font-weight: 600; }
  input {
    width: 100%; padding: 12px 14px; margin: 6px 0; border-radius: 10px;
    border: 1px solid rgba(255,255,255,0.12); background: rgba(0,0,0,0.3);
    color: #eee; font-size: 14px;
  }
  input:focus { outline: none; border-color: #7C9CFF; }
  button {
    width: 100%; padding: 12px; margin-top: 14px; border: none; border-radius: 10px;
    background: linear-gradient(135deg, #7C9CFF, #B37CFF); color: white;
    font-weight: 600; font-size: 14px; cursor: pointer;
  }
  button:disabled { opacity: 0.6; cursor: not-allowed; }
  #msg { margin-top: 12px; font-size: 13px; min-height: 18px; }
  a { color: #9CB4FF; text-decoration: none; }
  p.footer { margin-top: 16px; font-size: 13px; text-align: center; color: #999; }
  .guest-link { display: block; text-align: center; margin-top: 10px; font-size: 13px; }
  .password-wrap { position: relative; }
  .password-wrap input { padding-right: 42px; }
  .password-toggle {
    position: absolute; right: 4px; top: 50%; transform: translateY(-50%);
    width: auto; margin: 0; padding: 6px; background: none; border: none;
    display: flex; align-items: center; justify-content: center;
    color: #999; cursor: pointer;
  }
  .password-toggle:hover { color: #eee; }
  .field-links { display: flex; justify-content: flex-end; margin-top: -2px; margin-bottom: 6px; }
  .field-links a { font-size: 12.5px; color: #9CB4FF; }
  .terms-note { margin-top: 14px; font-size: 11.5px; text-align: center; color: #777; line-height: 1.5; }
  .terms-note a { color: #9CB4FF; }
</style>
</head>
<body>
  <form class="card" id="loginForm">
    <div class="brand">O B B Y</div>
    <h2>Masuk ke akun terdaftar</h2>
    <input type="email" id="email" placeholder="Email" required>
    <div class="password-wrap">
      <input type="password" id="password" placeholder="Password" required>
      <button type="button" class="password-toggle" id="togglePassword" aria-label="Tampilkan password"></button>
    </div>
    <div class="field-links"><a href="forgot-password.html">Lupa password?</a></div>
    <button type="submit" id="submitBtn">Masuk</button>
    <p id="msg"></p>
    <p class="footer">Belum punya akun? <a href="signup.html">Daftar di sini</a></p>
    <a class="guest-link" href="index.html">Lanjutkan sebagai tamu →</a>
    <p class="terms-note">Dengan masuk, kamu menyetujui <a href="terms.html">Syarat Layanan</a> dan <a href="privacy.html">Kebijakan Privasi</a> kami.</p>
  </form>

<script src="auth.js"></script>
<script>
  (function () {
    const EYE_OPEN = '<svg width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7Z" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><circle cx="12" cy="12" r="3" stroke="currentColor" stroke-width="1.8"/></svg>';
    const EYE_OFF = '<svg width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="M17.94 17.94A10.94 10.94 0 0 1 12 20c-7 0-11-8-11-8a19.4 19.4 0 0 1 5.06-5.94M9.9 4.24A10.94 10.94 0 0 1 12 4c7 0 11 8 11 8a19.5 19.5 0 0 1-2.16 3.19M14.12 14.12a3 3 0 1 1-4.24-4.24" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><path d="M1 1l22 22" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>';
    const pwInput = document.getElementById('password');
    const toggleBtn = document.getElementById('togglePassword');
    toggleBtn.innerHTML = EYE_OPEN;
    toggleBtn.addEventListener('click', () => {
      const show = pwInput.type === 'password';
      pwInput.type = show ? 'text' : 'password';
      toggleBtn.innerHTML = show ? EYE_OFF : EYE_OPEN;
      toggleBtn.setAttribute('aria-label', show ? 'Sembunyikan password' : 'Tampilkan password');
    });
  })();

  document.getElementById('loginForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const msg = document.getElementById('msg');
    const btn = document.getElementById('submitBtn');
    const email = document.getElementById('email').value;
    const password = document.getElementById('password').value;

    btn.disabled = true;
    msg.style.color = '#aaa';
    msg.textContent = 'Memproses...';

    try {
      const data = await ObbyAuth.login({ email, password });
      ObbyAuth.setSession(data.token, data.user);
      msg.style.color = '#6BFFB0';
      msg.textContent = 'Berhasil! Mengalihkan ke chat...';
      setTimeout(() => { window.location.href = 'index.html'; }, 600);
    } catch (err) {
      msg.style.color = '#FF6B6B';
      msg.textContent = err.message;
      btn.disabled = false;
    }
  });
</script>
</body>
</html>
