<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Daftar — OBBY AI</title>
<style>
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    font-family: 'Inter', system-ui, sans-serif;
    background: #060B18;
    color: #eee;
    display: flex; align-items: center; justify-content: center;
    min-height: 100vh; margin: 0; padding: 20px;
    position: relative; overflow-x: hidden;
  }

  .liquid-bg { position: fixed; inset: 0; overflow: hidden; z-index: 0; pointer-events: none; }
  .blob { position: absolute; border-radius: 50%; filter: blur(90px); }
  .blob-1 {
    width: 460px; height: 460px; top: -140px; left: -120px;
    background: radial-gradient(circle at 35% 35%, #2F6BFF, transparent 70%);
    opacity: 0.55; animation: floatA 16s ease-in-out infinite;
  }
  .blob-2 {
    width: 420px; height: 420px; bottom: -150px; right: -100px;
    background: radial-gradient(circle at 65% 65%, #22D3EE, transparent 70%);
    opacity: 0.5; animation: floatB 18s ease-in-out infinite;
  }
  .blob-3 {
    width: 320px; height: 320px; top: 35%; left: 55%;
    background: radial-gradient(circle, #7C9CFF, transparent 70%);
    opacity: 0.35; animation: floatC 20s ease-in-out infinite;
  }
  @keyframes floatA { 0%,100%{transform:translate(0,0);} 50%{transform:translate(50px,40px);} }
  @keyframes floatB { 0%,100%{transform:translate(0,0);} 50%{transform:translate(-40px,-50px);} }
  @keyframes floatC { 0%,100%{transform:translate(0,0) scale(1);} 50%{transform:translate(-30px,25px) scale(1.1);} }
  @media (prefers-reduced-motion: reduce) {
    .blob { animation: none !important; }
  }

  .card {
    position: relative; z-index: 1;
    background: rgba(255,255,255,0.06);
    border: 1px solid rgba(255,255,255,0.14);
    backdrop-filter: blur(28px) saturate(160%);
    -webkit-backdrop-filter: blur(28px) saturate(160%);
    box-shadow: 0 20px 60px -20px rgba(0,0,0,0.6), inset 0 1px 0 rgba(255,255,255,0.06);
    padding: 36px 32px; border-radius: 22px; width: 340px;
  }
  .brand-row { display: flex; align-items: center; gap: 9px; margin-bottom: 4px; }
  .brand-logo { width: 28px; height: 28px; border-radius: 9px; display: block; }
  .brand { font-weight: 700; letter-spacing: 2px; }
  h2 { margin: 0 0 20px; font-size: 20px; font-weight: 600; }
  input {
    width: 100%; padding: 12px 14px; margin: 6px 0; border-radius: 10px;
    border: 1px solid rgba(255,255,255,0.14); background: rgba(0,0,0,0.28);
    color: #eee; font-size: 14px;
  }
  input:focus { outline: none; border-color: #3FA9F5; }
  .password-wrap { position: relative; }
  .password-wrap input { padding-right: 42px; }
  .toggle-password-btn {
    position: absolute; right: 8px; top: 50%; transform: translateY(-50%);
    background: none; border: none; padding: 4px; margin: 0; width: auto;
    cursor: pointer; color: #888; display: flex; align-items: center;
  }
  .toggle-password-btn:hover { color: #ccc; }
  button.submit-btn {
    width: 100%; padding: 12px; margin-top: 14px; border: none; border-radius: 10px;
    background: linear-gradient(135deg, #2F6BFF, #22D3EE); color: white;
    font-weight: 600; font-size: 14px; cursor: pointer;
    box-shadow: 0 6px 20px -6px rgba(47,107,255,0.5);
  }
  button:disabled { opacity: 0.6; cursor: not-allowed; }
  #msg { margin-top: 12px; font-size: 13px; min-height: 18px; }
  a { color: #6FC7FF; text-decoration: none; }
  p.footer { margin-top: 16px; font-size: 13px; text-align: center; color: #999; }
  .tos-row {
    display: flex; align-items: flex-start; gap: 8px; margin: 14px 0 4px;
    font-size: 12px; color: #999; line-height: 1.4;
  }
  .tos-row input[type="checkbox"] { width: auto; margin: 2px 0 0; flex-shrink: 0; }
  .tos-row a { color: #6FC7FF; }
</style>
</head>
<body>
  <div class="liquid-bg" aria-hidden="true">
    <span class="blob blob-1"></span>
    <span class="blob blob-2"></span>
    <span class="blob blob-3"></span>
  </div>

  <form class="card" id="signupForm">
    <div class="brand-row">
      <img src="icon-192.png" alt="OBBY AI" class="brand-logo">
      <div class="brand">O B B Y</div>
    </div>
    <h2>Buat akun baru</h2>
    <input type="text" id="name" placeholder="Nama (opsional)">
    <input type="email" id="email" placeholder="Email" required>
    <div class="password-wrap">
      <input type="password" id="password" placeholder="Password (min 8 karakter)" required>
      <button type="button" class="toggle-password-btn" data-target="password" aria-label="Lihat password">
        <svg class="eye-open" width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7Z" stroke="currentColor" stroke-width="2"/><circle cx="12" cy="12" r="3" stroke="currentColor" stroke-width="2"/></svg>
        <svg class="eye-closed" width="18" height="18" viewBox="0 0 24 24" fill="none" style="display:none;"><path d="M3 3l18 18M10.6 10.6a2 2 0 0 0 2.8 2.8M9.4 5.3A10.5 10.5 0 0 1 12 5c7 0 11 7 11 7a13.4 13.4 0 0 1-3.1 3.6M6.1 6.1A13.6 13.6 0 0 0 1 12s4 7 11 7a10.4 10.4 0 0 0 4-0.8" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
      </button>
    </div>

    <label class="tos-row">
      <input type="checkbox" id="tosCheckbox" required>
      <span>Saya menyetujui <a href="terms.html" target="_blank">Syarat Layanan</a> dan <a href="privacy.html" target="_blank">Kebijakan Privasi</a> OBBY AI</span>
    </label>

    <button type="submit" class="submit-btn" id="submitBtn">Daftar</button>
    <p id="msg"></p>
    <p class="footer">Sudah punya akun? <a href="login.html">Login di sini</a></p>
  </form>

<script src="auth.js"></script>
<script>
  document.querySelectorAll('.toggle-password-btn').forEach((btn) => {
    btn.addEventListener('click', () => {
      const input = document.getElementById(btn.dataset.target);
      const isHidden = input.type === 'password';
      input.type = isHidden ? 'text' : 'password';
      btn.querySelector('.eye-open').style.display = isHidden ? 'none' : 'block';
      btn.querySelector('.eye-closed').style.display = isHidden ? 'block' : 'none';
    });
  });

  document.getElementById('signupForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const msg = document.getElementById('msg');
    const btn = document.getElementById('submitBtn');
    const name = document.getElementById('name').value;
    const email = document.getElementById('email').value;
    const password = document.getElementById('password').value;
    const tosChecked = document.getElementById('tosCheckbox').checked;

    if (!tosChecked) {
      msg.style.color = '#FF6B6B';
      msg.textContent = 'Kamu harus menyetujui Syarat Layanan dulu';
      return;
    }

    btn.disabled = true;
    msg.style.color = '#aaa';
    msg.textContent = 'Mohon tunggu sebentar...';

    try {
      const data = await ObbyAuth.signup({ name, email, password });
      msg.style.color = '#6BFFB0';
      msg.textContent = 'Berhasil! Cek email untuk kode verifikasi...';
      setTimeout(() => {
        window.location.href = `verify-email.html?email=${encodeURIComponent(email)}`;
      }, 600);
    } catch (err) {
      msg.style.color = '#FF6B6B';
      msg.textContent = err.message;
      btn.disabled = false;
    }
  });
</script>
</body>
</html>
