<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Daftar — OBBY AI</title>
<style>
  * { box-sizing: border-box; }
  body {
    font-family: 'Inter', system-ui, sans-serif;
    background: #060B18;
    color: #eee;
    display: flex; align-items: center; justify-content: center;
    min-height: 100vh; margin: 0; padding: 20px;
  }
  .card {
    background: rgba(255,255,255,0.04);
    border: 1px solid rgba(255,255,255,0.08);
    backdrop-filter: blur(20px);
    padding: 36px 32px; border-radius: 20px; width: 340px;
  }
  .brand { font-weight: 700; letter-spacing: 2px; margin-bottom: 4px; }
  h2 { margin: 0 0 20px; font-size: 20px; font-weight: 600; }
  input {
    width: 100%; padding: 12px 14px; margin: 6px 0; border-radius: 10px;
    border: 1px solid rgba(255,255,255,0.12); background: rgba(0,0,0,0.3);
    color: #eee; font-size: 14px;
  }
  input:focus { outline: none; border-color: #7C9CFF; }
  button {
    width: 100%; padding: 12px; margin-top: 14px; border: none; border-radius: 10px;
    background: linear-gradient(135deg, #7C9CFF, #B37CFF); color: white;
    font-weight: 600; font-size: 14px; cursor: pointer;
  }
  button:disabled { opacity: 0.6; cursor: not-allowed; }
  #msg { margin-top: 12px; font-size: 13px; min-height: 18px; }
  a { color: #9CB4FF; text-decoration: none; }
  p.footer { margin-top: 16px; font-size: 13px; text-align: center; color: #999; }
</style>
</head>
<body>
  <form class="card" id="signupForm">
    <div class="brand">O B B Y</div>
    <h2>Buat akun baru</h2>
    <input type="text" id="name" placeholder="Nama (opsional)">
    <input type="email" id="email" placeholder="Email" required>
    <input type="password" id="password" placeholder="Password (min 8 karakter)" required>
    <button type="submit" id="submitBtn">Daftar</button>
    <p id="msg"></p>
    <p class="footer">Sudah punya akun? <a href="login.html">Login di sini</a></p>
  </form>

<script src="auth.js"></script>
<script>
  document.getElementById('signupForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const msg = document.getElementById('msg');
    const btn = document.getElementById('submitBtn');
    const name = document.getElementById('name').value;
    const email = document.getElementById('email').value;
    const password = document.getElementById('password').value;

    btn.disabled = true;
    msg.style.color = '#aaa';
    msg.textContent = 'Memproses...';

    try {
      const data = await ObbyAuth.signup({ name, email, password });
      msg.style.color = '#6BFFB0';
      msg.textContent = 'Berhasil! Cek email untuk kode verifikasi...';
      setTimeout(() => {
        window.location.href = `verify-email.html?email=${encodeURIComponent(email)}`;
      }, 600);
    } catch (err) {
      msg.style.color = '#FF6B6B';
      msg.textContent = err.message;
      btn.disabled = false;
    }
  });
</script>
</body>
</html>
