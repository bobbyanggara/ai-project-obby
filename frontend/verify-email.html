<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Verifikasi Email — OBBY AI</title>
<style>
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    font-family: 'Inter', system-ui, sans-serif;
    background: #060B18;
    color: #eee;
    display: flex; align-items: center; justify-content: center;
    min-height: 100vh; margin: 0; padding: 20px;
    position: relative; overflow-x: hidden;
  }

  .liquid-bg { position: fixed; inset: 0; overflow: hidden; z-index: 0; pointer-events: none; }
  .blob { position: absolute; border-radius: 50%; filter: blur(90px); }
  .blob-1 {
    width: 460px; height: 460px; top: -140px; left: -120px;
    background: radial-gradient(circle at 35% 35%, #2F6BFF, transparent 70%);
    opacity: 0.55; animation: floatA 16s ease-in-out infinite;
  }
  .blob-2 {
    width: 420px; height: 420px; bottom: -150px; right: -100px;
    background: radial-gradient(circle at 65% 65%, #22D3EE, transparent 70%);
    opacity: 0.5; animation: floatB 18s ease-in-out infinite;
  }
  .blob-3 {
    width: 320px; height: 320px; top: 35%; left: 55%;
    background: radial-gradient(circle, #7C9CFF, transparent 70%);
    opacity: 0.35; animation: floatC 20s ease-in-out infinite;
  }
  @keyframes floatA { 0%,100%{transform:translate(0,0);} 50%{transform:translate(50px,40px);} }
  @keyframes floatB { 0%,100%{transform:translate(0,0);} 50%{transform:translate(-40px,-50px);} }
  @keyframes floatC { 0%,100%{transform:translate(0,0) scale(1);} 50%{transform:translate(-30px,25px) scale(1.1);} }
  @media (prefers-reduced-motion: reduce) {
    .blob { animation: none !important; }
  }

  .card {
    position: relative; z-index: 1;
    background: rgba(255,255,255,0.06);
    border: 1px solid rgba(255,255,255,0.14);
    backdrop-filter: blur(28px) saturate(160%);
    -webkit-backdrop-filter: blur(28px) saturate(160%);
    box-shadow: 0 20px 60px -20px rgba(0,0,0,0.6), inset 0 1px 0 rgba(255,255,255,0.06);
    padding: 36px 32px; border-radius: 22px; width: 340px;
  }
  .brand-row { display: flex; align-items: center; gap: 9px; margin-bottom: 4px; }
  .brand-logo { width: 28px; height: 28px; border-radius: 9px; display: block; }
  .brand { font-weight: 700; letter-spacing: 2px; }
  h2 { margin: 0 0 8px; font-size: 20px; font-weight: 600; }
  p.desc { color: #999; font-size: 13px; margin: 0 0 18px; line-height: 1.4; }
  input {
    width: 100%; padding: 12px 14px; margin: 6px 0; border-radius: 10px;
    border: 1px solid rgba(255,255,255,0.14); background: rgba(0,0,0,0.28);
    color: #eee; font-size: 22px; text-align: center; letter-spacing: 10px; font-weight: 700;
  }
  input:focus { outline: none; border-color: #3FA9F5; }
  button {
    width: 100%; padding: 12px; margin-top: 14px; border: none; border-radius: 10px;
    background: linear-gradient(135deg, #2F6BFF, #22D3EE); color: white;
    font-weight: 600; font-size: 14px; cursor: pointer;
    box-shadow: 0 6px 20px -6px rgba(47,107,255,0.5);
  }
  button:disabled { opacity: 0.6; cursor: not-allowed; }
  button.secondary { background: rgba(255,255,255,0.08); margin-top: 8px; box-shadow: none; }
  #msg { margin-top: 12px; font-size: 13px; min-height: 18px; }
  a { color: #6FC7FF; text-decoration: none; }
  p.footer { margin-top: 16px; font-size: 13px; text-align: center; color: #999; }
</style>
</head>
<body>
  <div class="liquid-bg" aria-hidden="true">
    <span class="blob blob-1"></span>
    <span class="blob blob-2"></span>
    <span class="blob blob-3"></span>
  </div>

  <form class="card" id="verifyForm">
    <div class="brand-row">
      <img src="icon-192.png" alt="OBBY AI" class="brand-logo">
      <div class="brand">O B B Y</div>
    </div>
    <h2 data-i18n="verifyHeading">Verifikasi Email</h2>
    <p class="desc" id="verifyDesc"></p>
    <input type="text" id="otpInput" placeholder="000000" maxlength="6" inputmode="numeric" required>
    <button type="submit" id="verifyBtn" data-i18n="verifyBtn">Verifikasi</button>
    <button type="button" class="secondary" id="resendBtn" data-i18n="resendBtn">Kirim ulang kode</button>
    <p id="msg"></p>
    <p class="footer"><a href="login.html" data-i18n="backToLogin">← Kembali ke Login</a></p>
  </form>

<script src="auth-i18n.js"></script>
<script src="auth.js"></script>
<script>
  function escapeHtmlSimple(str) {
    return str.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  }

  const params = new URLSearchParams(window.location.search);
  const email = params.get('email') || '';

  document.getElementById('verifyDesc').innerHTML = t('verifyDescTemplate', {
    email: `<strong>${escapeHtmlSimple(email)}</strong>`,
  });

  if (!email) {
    document.getElementById('msg').style.color = '#FF6B6B';
    document.getElementById('msg').textContent = t('msgEmailNotFound');
  }

  document.getElementById('verifyForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const msg = document.getElementById('msg');
    const btn = document.getElementById('verifyBtn');
    const otp = document.getElementById('otpInput').value;

    btn.disabled = true;
    msg.style.color = '#aaa';
    msg.textContent = t('msgVerifying');

    try {
      const data = await ObbyAuth.verifyEmail({ email, otp });
      ObbyAuth.setSession(data.token, data.user);
      msg.style.color = '#6BFFB0';
      msg.textContent = t('msgSuccessRedirectChat');
      setTimeout(() => { window.location.href = 'index.html'; }, 800);
    } catch (err) {
      msg.style.color = '#FF6B6B';
      msg.textContent = err.message;
      btn.disabled = false;
    }
  });

  document.getElementById('resendBtn').addEventListener('click', async () => {
    const msg = document.getElementById('msg');
    msg.style.color = '#aaa';
    msg.textContent = t('msgResending');
    try {
      await ObbyAuth.resendVerification(email);
      msg.style.color = '#6BFFB0';
      msg.textContent = t('msgResentSuccess');
    } catch (err) {
      msg.style.color = '#FF6B6B';
      msg.textContent = err.message;
    }
  });
</script>
</body>
</html>
